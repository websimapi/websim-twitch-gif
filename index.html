<html>
<head>
    <base href="." />
    <title>Twitch GIF Maker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
</head>
<body>
    <div class="container">
        <h1>Twitch GIF Maker</h1>
        <div class="preview-wrapper">
            <div class="preview-container">
                <canvas id="preview" width="112" height="112"></canvas>
            </div>
            <div class="live-preview" id="livePreview">
                <canvas id="previewAnimation" width="112" height="112"></canvas>
            </div>
        </div>
        <div class="controls">
            <div class="settings-panel">
                <div class="settings-group">
                    <h3>Image Settings</h3>
                    <div class="image-settings">
                        <div class="setting-item">
                            <label>Background Color</label>
                            <div class="color-picker">
                                <input type="color" id="backgroundColor" value="#000000">
                                <span id="backgroundColorValue">#000000</span>
                            </div>
                        </div>
                        <div class="setting-item">
                            <label for="opacity">Opacity (%)</label>
                            <input type="range" id="opacity" min="0" max="100" value="100">
                        </div>
                        <div class="setting-item">
                            <label for="scale">Scale (%)</label>
                            <input type="range" id="scale" min="10" max="100" value="100">
                        </div>
                    </div>
                </div>
                
                <div class="settings-group">
                    <h3>Animation Settings</h3>
                    <div class="setting-item">
                        <label for="animationSpeed">Animation Speed</label>
                        <input type="range" id="animationSpeed" min="0.5" max="3" step="0.1" value="1">
                        <span id="animationSpeedValue">1x</span>
                    </div>
                    <div class="setting-item">
                        <label for="animationIntensity">Animation Intensity</label>
                        <input type="range" id="animationIntensity" min="1" max="10" value="5">
                        <span id="animationIntensityValue">5</span>
                    </div>
                </div>
            </div>
            
            <label for="fileInput">Upload Images (PNG/JPG):</label>
            <input type="file" id="fileInput" accept="image/*" multiple>
            
            <label>Animation Style:</label>
            <div class="animation-options">
                <div class="animation-option selected" data-animation="none">
                    <div class="animation-preview"></div>
                    None
                </div>
                <div class="animation-option" data-animation="rotate">
                    <div class="animation-preview rotate-preview"></div>
                    Rotate
                </div>
                <div class="animation-option" data-animation="bounce">
                    <div class="animation-preview bounce-preview"></div>
                    Bounce
                </div>
                <div class="animation-option" data-animation="fade">
                    <div class="animation-preview fade-preview"></div>
                    Fade
                </div>
                <div class="animation-option" data-animation="shake">
                    <div class="animation-preview shake-preview"></div>
                    Shake
                </div>
                <div class="animation-option" data-animation="pulse">
                    <div class="animation-preview pulse-preview"></div>
                    Pulse
                </div>
                <div class="animation-option" data-animation="flip">
                    <div class="animation-preview flip-preview"></div>
                    Flip
                </div>
                <div class="animation-option" data-animation="swing">
                    <div class="animation-preview swing-preview"></div>
                    Swing
                </div>
                <div class="animation-option" data-animation="zoom">
                    <div class="animation-preview zoom-preview"></div>
                    Zoom
                </div>
                <div class="animation-option" data-animation="spin">
                    <div class="animation-preview spin-preview"></div>
                    Spin
                </div>
                <div class="animation-option" data-animation="wiggle">
                    <div class="animation-preview wiggle-preview"></div>
                    Wiggle
                </div>
                <div class="animation-option" data-animation="squeeze">
                    <div class="animation-preview squeeze-preview"></div>
                    Squeeze
                </div>
                <div class="animation-option" data-animation="slide">
                    <div class="animation-preview slide-preview"></div>
                    Slide
                </div>
                <div class="animation-option" data-animation="glitch">
                    <div class="animation-preview glitch-preview"></div>
                    Glitch
                </div>
            </div>
            
            <label for="fps">FPS:</label>
            <input type="range" id="fps" min="1" max="60" value="30">
            <span id="fpsValue">30 FPS</span>
            
            <label for="quality">Quality (1-10):</label>
            <input type="range" id="quality" min="1" max="10" value="7">
            <span id="qualityValue">7</span>

            <label for="duration">Duration (seconds):</label>
            <input type="range" id="duration" min="1" max="10" value="3">
            <span id="durationValue">3s</span>
            
            <button id="generateGif">Generate GIF</button>
            <button id="clearCanvas">Clear</button>
        </div>
        
        <div class="settings-panel">
            <div class="settings-group">
                <h3>AI Image Generation</h3>
                <div class="ai-generation-container">
                    <div class="setting-item">
                        <label for="imagePrompt">Image Description:</label>
                        <textarea id="imagePrompt" placeholder="Describe the image you want to generate..."></textarea>
                    </div>
                    <div class="setting-item">
                        <label for="aspectRatio">Aspect Ratio:</label>
                        <select id="aspectRatio">
                            <option value="1:1">1:1 (Square)</option>
                            <option value="16:9">16:9</option>
                            <option value="3:2">3:2</option>
                            <option value="4:3">4:3</option>
                        </select>
                    </div>
                    <div class="advanced-mode">
                        <input type="checkbox" id="advancedMode">
                        <label for="advancedMode">Advanced Mode (Let AI enhance your prompt)</label>
                    </div>
                    <button id="generateImage">Generate Image</button>
                    <div id="generationStatus" class="generation-status"></div>
                </div>
            </div>
        </div>
    </div>

<script src="app.js"></script>

</body>
</html>
